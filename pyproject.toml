[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-data-pipeline"
version = "0.1.0"
description = "Versioned feedback data for small-model distillation"
requires-python = ">=3.11"

[project.scripts]
nano-data-pipeline = "nano_data_pipeline.cli:main"

[project.optional-dependencies]
generation = [
  "openai>=2.0",
  "transformers>=5.0",
]

[tool.setuptools.packages.find]
include = ["nano_data_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
